[package]
name = "artisan"
version = "0.1.0"
edition = "2024"
description = "High-performance web-first ECS engine"
license = "MIT"
repository = "https://github.com/soldatenente/artisan"

[workspace]
members = [
    ".",
    "demos/vivarium_civ",
    "demos/murmuration",
    "demos/bouncing_rects",
    "demos/scheduler",
    "demos/metamorphosis",
    "demos/planet",
]
exclude = ["benches/bevy_bench"]
resolver = "2"

[lib]
name = "artisan"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "bench_ecs"
path = "src/bin/bench_ecs.rs"

[[bin]]
name = "bench_fair"
path = "src/bin/bench_fair.rs"

[[bin]]
name = "verify_render_cache"
path = "src/bin/verify_render_cache.rs"

[dependencies]
wasm-bindgen = "0.2.122"
rayon = "1.12.0"
js-sys = "0.3.99"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
glam = { version = "0.33.0", features = ["serde"] }
wasm-bindgen-rayon = { version = "1.2", features = ["no-bundler"] }
noise = "0.9.0"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
panic = "abort"

[profile.release-native]
inherits = "release"
lto = "thin"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
