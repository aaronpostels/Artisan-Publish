[alias]
bench-native-scalar = "run --release --config 'build.rustflags=[\"-C\", \"target-feature=-avx,-avx2,-sse3,-ssse3,-sse4.1,-sse4.2,-simd128\"]'"
bench-native-simd   = "run --release --config 'build.rustflags=[\"-C\", \"target-cpu=native\"]'"

[target.wasm32-unknown-unknown]
rustflags = [
    "-C", "target-feature=+atomics,+bulk-memory,+simd128",
    "-A", "unstable_features",
    "-C", "link-arg=--shared-memory",
    "-C", "link-arg=--import-memory",
    "-C", "link-arg=--max-memory=1073741824",
    "-C", "link-arg=--export=__wasm_init_tls",
    "-C", "link-arg=--export=__tls_size",
    "-C", "link-arg=--export=__tls_align",
    "-C", "link-arg=--export=__tls_base",
]

[unstable]
build-std = ["panic_abort", "std"]
