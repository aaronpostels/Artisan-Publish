[package]
name = "bevy_bench"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
bevy_ecs = "0.18.1"
bevy = { version = "0.18.1", features = ["dynamic_linking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
rand = "0.10.1"

[[bin]]
name = "bevy_bench"
path = "src/main.rs"

[[bin]]
name = "bevy_bench_ecs"
path = "src/bin/bench_ecs.rs"

[[bin]]
name = "bevy_bench_fair"
path = "src/bin/bench_fair.rs"

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
